<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html>
  <head>
    <meta charset="UTF-8" />
    <meta content="text/html" http-equiv="Content-Type" />
    <title>Email Signature</title>
  </head>

  <body style="margin: 0; padding: 0;">
    <!-- OUTER CONTAINER -->
    <table cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
      <tbody>
        <tr>

          <!-- ==================== SECTION #1: Photo ==================== -->
          <td style="padding: 8px 16px 8px 0; text-align: center; vertical-align: middle;">
            <a href="https://leafandlayer-com.l.ink/" target="_blank" style="text-decoration: none;">
              <img
                alt="Leaf & Layer"
                style="width: 140px; height: 140px; display: block;"
                src="https://github.com/MJ-Freeman/website-assets/blob/main/assets/logos/ll-logo.png?raw=true"
              >
            </a>
          </td>

          <!-- ==================== DIVIDER ==================== -->
          <td style="padding: 0 16px 0 0; vertical-align: middle;">
            <div style="width: 1px; height: 130px; background-color: #112240;"></div>
          </td>

          <!-- ==================== SECTION #2: Info ==================== -->
          <td style="padding: 8px 0; vertical-align: middle;">
            <table cellpadding="0" cellspacing="0">
              <tbody>

                <!-- Name -->
                <tr>
                  <td style="padding-bottom: 3px;">
                    <span style="font-family: Georgia, 'Times New Roman', serif; font-size: 17px; font-weight: bold; color: #000000; letter-spacing: 0.5px;">
                      Melanie Freeman
                    </span>
                  </td>
                </tr>

                <!-- Job Title -->
                <tr>
                  <td style="padding-bottom: 3px;">
                    <span style="font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #000000; font-style: italic; letter-spacing: 0.3px;">
                      Terrarium Workshop Host
                    </span>
                  </td>
                </tr>

                <!-- Company -->
                <tr>
                  <td style="padding-bottom: 14px;">
                    <a href="https://leafandlayer-com.l.ink/" target="_blank" style="text-decoration: none;">
                      <span style="font-family: Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; color: #3a7d55; letter-spacing: 1px;">
                        Leaf &amp; Layer
                      </span>
                    </a>
                  </td>
                </tr>

                <!-- Social Icons -->
                <tr>
                  <td>
                    <table cellpadding="0" cellspacing="0">
                      <tbody>
                        <tr>

                          <!-- Website -->
                          <td style="padding-right: 10px;">
                            <a style="text-decoration: none;" href="https://leafandlayer-com.l.ink/" target="_blank">
                              <img alt="website" style="width: 25px; height: auto; display: block;" src="https://github.com/MJ-Freeman/website-assets/blob/main/assets/common/website-logo.png?raw=true">
                            </a>
                          </td>

                          <!-- Email -->
                          <td style="padding-right: 10px;">
                            <a style="text-decoration: none;" href="mailto:melanie@leafandlayer.com" target="_blank">
                              <img alt="email" style="width: 25px; height: auto; display: block;" src="https://github.com/MJ-Freeman/website-assets/blob/main/assets/common/email-logo-icon.png?raw=true">
                            </a>
                          </td>

                          <!-- WhatsApp -->
                          <td style="padding-right: 10px;">
                            <a style="text-decoration: none;" href="https://wa.me/07504981925" target="_blank">
                              <img alt="whatsapp" style="width: 21px; height: auto; display: block;" src="https://github.com/MJ-Freeman/website-assets/blob/main/assets/common/whatsapp-black-logo-icon.png?raw=true">
                            </a>
                          </td>

                          <!-- Instagram -->
                          <td>
                            <a style="text-decoration: none;" href="https://www.instagram.com/leafandlayer.terrariums" target="_blank">
                              <img alt="instagram" style="width: 25px; height: auto; display: block;" src="https://github.com/MJ-Freeman/website-assets/blob/main/assets/common/instagram-logo-black-transparent.png?raw=true">
                            </a>
                          </td>

                        </tr>
                      </tbody>
                    </table>
                  </td>
                </tr>

              </tbody>
            </table>
          </td>

        </tr>
      </tbody>
    </table>
  </body>
</html>
